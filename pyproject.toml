[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-salarios"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "duckdb",
    "matplotlib>=3.8",
    "pandas",
    "pycountry>=24.6.1",
    "pytest",
    "streamlit>=1.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
